version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kilombino-jam-xbt_web_1
      APP_PORT: 28183

  # JoinBlaket's RPC filter: the only container with the node's RPC credentials.
  # It passes on to the node only the RPCs JoinBlaket uses, on its own wallets
  # (rpc_filter.py in the image); Jam and everything that talks to the network
  # (web, below) get the filter's own random credentials instead.
  rpcfilter:
    # Reproducible build of joinblaket v0.43.0-xbt7 + jam v2.0.0-beta.4-xbt7 (amd64 + arm64).
    image: ghcr.io/kilombino/jam-xbt:0.43.0-xbt7@sha256:f6f4a194a6f20ac56949b02f2a92032bad29dc5e466a4938838951a2960a217d
    user: "1000:1000"
    restart: on-failure
    volumes:
      # its own credentials for Jam (client.cookie, created at first start)
      - ${APP_DATA_DIR}/rpc-filter:/rpc-filter
    # The node is whichever app the user picked for the "bitcoin" dependency
    # (umbrelOS 1.3 or later), as in Kilowallet: every node app that implements
    # "bitcoin" exports APP_BITCOIN_*; the app-specific names are a fallback. The
    # first set with an address and a port wins.
    entrypoint:
      - /bin/sh
      - -c
      - |
        for p in KNOTS_BLAKE2B BITCOIN_KNOTS BITCOIN; do
          eval "ip=\$${NODE_$${p}_IP:-} port=\$${NODE_$${p}_PORT:-}"
          if [ -n "$$ip" ] && [ -n "$$port" ]; then
            eval "JM_RPC_FILTER_NODE_USER=\$${NODE_$${p}_USER:-} JM_RPC_FILTER_NODE_PASS=\$${NODE_$${p}_PASS:-}"
            JM_RPC_FILTER_NODE_URL="http://$$ip:$$port"
            export JM_RPC_FILTER_NODE_URL JM_RPC_FILTER_NODE_USER JM_RPC_FILTER_NODE_PASS
            echo "JoinBlaket RPC filter: node at $$JM_RPC_FILTER_NODE_URL (APP_$${p}_*)" >&2
            break
          fi
        done
        unset NODE_KNOTS_BLAKE2B_PASS NODE_BITCOIN_KNOTS_PASS NODE_BITCOIN_PASS
        if [ -z "$${JM_RPC_FILTER_NODE_URL:-}" ]; then
          echo "JoinBlaket: no Bitcoin node app is selected or installed; choose one in this app's settings (a node on the BLAKE2b chain)" >&2
          sleep 60
          exit 1
        fi
        exec python /usr/local/lib/jm-xbt/rpc_filter.py
    healthcheck:
      test: ["CMD", "python", "/usr/local/lib/jm-xbt/rpc_filter.py", "--check"]
      interval: 1m
      timeout: 30s
      start_period: 30s
    environment:
      JM_RPC_FILTER_LISTEN: "0.0.0.0:28187"
      JM_RPC_FILTER_CLIENT_COOKIE: /rpc-filter/client.cookie
      PYTHONUNBUFFERED: "1"
      # Knots (BLAKE2b) Companion, PaulsCode.Com store
      NODE_KNOTS_BLAKE2B_IP: "${APP_KNOTS_BLAKE2B_NODE_IP:-}"
      NODE_KNOTS_BLAKE2B_PORT: "${APP_KNOTS_BLAKE2B_RPC_PORT:-}"
      NODE_KNOTS_BLAKE2B_USER: "${APP_KNOTS_BLAKE2B_RPC_USER:-}"
      NODE_KNOTS_BLAKE2B_PASS: "${APP_KNOTS_BLAKE2B_RPC_PASS:-}"
      # Bitcoin Knots, Misc store (btc-bitcoinknots) or Umbrel App Store (bitcoin-knots)
      NODE_BITCOIN_KNOTS_IP: "${APP_BITCOIN_KNOTS_NODE_IP:-}"
      NODE_BITCOIN_KNOTS_PORT: "${APP_BITCOIN_KNOTS_RPC_PORT:-}"
      NODE_BITCOIN_KNOTS_USER: "${APP_BITCOIN_KNOTS_RPC_USER:-}"
      NODE_BITCOIN_KNOTS_PASS: "${APP_BITCOIN_KNOTS_RPC_PASS:-}"
      # The selected "bitcoin" provider, whichever it is
      NODE_BITCOIN_IP: "${APP_BITCOIN_NODE_IP:-}"
      NODE_BITCOIN_PORT: "${APP_BITCOIN_RPC_PORT:-}"
      NODE_BITCOIN_USER: "${APP_BITCOIN_RPC_USER:-}"
      NODE_BITCOIN_PASS: "${APP_BITCOIN_RPC_PASS:-}"

  web:
    image: ghcr.io/kilombino/jam-xbt:0.43.0-xbt7@sha256:f6f4a194a6f20ac56949b02f2a92032bad29dc5e466a4938838951a2960a217d
    user: "1000:1000"
    restart: on-failure
    # A CoinJoin in progress may be signing when stopped.
    stop_grace_period: 1m
    depends_on:
      - rpcfilter
    volumes:
      # wallets (*.jmdat), PoDLE commitments, history, Tor state
      - ${APP_DATA_DIR}/data:/data
      # the filter's credentials, read-only; no node credentials here
      - ${APP_DATA_DIR}/rpc-filter:/run/jm-xbt-rpc:ro
    # The image's own entrypoint; it refuses (and waits) on a node not on the
    # BLAKE2b chain, and if the filter is down the node shows as unreachable.
    environment:
      # Umbrel's app_proxy adds the login; it reaches jmwalletd over plain HTTP
      # on the app network. Tor and the orderbook watcher stay on 127.0.0.1.
      JMWALLETD_NO_TLS: "true"
      BITCOIN_RPC_URL: http://kilombino-jam-xbt_rpcfilter_1:28187
      BITCOIN_RPC_COOKIE: /run/jm-xbt-rpc/client.cookie
      JM_XBT_RPC_FILTER: external
