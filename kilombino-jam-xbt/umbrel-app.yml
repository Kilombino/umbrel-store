releaseNotes: >-
  JoinBlaket 0.43.0-xbt10. The orderbook now shows the largest CoinJoin 1, 2
  and 3 makers with a fidelity bond can fill right now: in a CoinJoin each maker
  has to cover the whole amount alone, so liquidity does not add up across
  makers. When you send with CoinJoin, Jam warns before an amount bigger than
  the chosen number of makers can cover, says what fits now and suggests how to
  split it into several CoinJoins or use the scheduler. It is only a warning;
  you can still send. Your wallets are kept. From 0.43.0-xbt9: three
  directories by default. Jam v2.0.0-beta.4-xbt9.
