# umbrelOS 1.3 is the first version that lets the user pick which app answers a
# dependency (any installed app that declares `implements: [bitcoin]`).
manifestVersion: 1.3.0
id: kilombino-jam-xbt
category: bitcoin
name: JoinBlaket
version: "0.43.0-xbt2"
tagline: CoinJoin on Bitcoin (BLAKE2b) with the Jam wallet
description: >-
  JoinBlaket is JoinMarket-NG built for the Bitcoin (BLAKE2b) chain, with the
  Jam web wallet. Mix your coins with other people's in CoinJoins, or offer them to
  others and earn; your coins never leave your wallet. Nothing to configure.


  CoinJoin en Bitcoin BLAKE2b (BTC) con la cartera Jam: mezcla tus monedas
  con las de otros, u ofrécelas y gana. Nada que configurar; Jam sale en
  español si tu navegador está en español.


  HOW IT WORKS


  Jam keeps a watch-only wallet in your BLAKE2b node and checks that the node
  follows the BLAKE2b chain: on any other node it does not start. It talks to
  the JoinBlaket directory over its own Tor, with verified nick
  authentication, and only to JoinMarket peers on the BLAKE2b chain. It mixes only with makers
  that hold a fidelity bond; to earn you need one too (created in Jam, it
  locks the coins in it until the date you choose). Every signature uses the
  unified sighash (0x21), so nothing can be replayed on the SHA-256 chain.
  Create a new wallet in Jam (12 words, write them on paper) and use small
  amounts while the market is young.


  WHICH NODE IT NEEDS


  Any Bitcoin node app on your Umbrel that follows the BLAKE2b chain, with its
  wallet feature on: Knots (BLAKE2b) Companion from the PaulsCode.Com store
  (https://github.com/paulscode/umbrel-store), or Bitcoin Knots from the Misc
  store (https://github.com/Horizon-btc/Bitcoin-store) on the BLAKE2b chain.
  Jam picks it by itself. Needs umbrelOS 1.3 or later.
developer: Kilombino
website: https://github.com/Kilombino/joinblaket
dependencies:
  - bitcoin
repo: https://github.com/Kilombino/joinblaket
support: https://github.com/Kilombino/joinblaket/issues
# Clear of the PaulsCode.Com store's tiles (7150-7156), ThunderHub XBT (7160)
# and Kilowallet (7161).
port: 7165
icon: https://raw.githubusercontent.com/Kilombino/umbrel-store/master/kilombino-jam-xbt/icon.png
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  JoinBlaket 0.43.0-xbt2. Telegram notices for makers, set from Jam without a
  console: Settings › Telegram notices (bot token and chat id, a test button,
  turn off). You hear when someone takes your offer, when a CoinJoin is done and
  if the directories are lost. The token stays on your Umbrel and is never shown
  again. A CoinJoin now needs at least 1 maker (it was 4), and if there are fewer
  makers than you ask for it goes on with those there are, so the first CoinJoins
  can happen while the market is small; with a single maker, that maker can link
  your input to your output. Makers still need a fidelity bond. Your wallets are
  kept. Jam v2.0.0-beta.4-xbt4.
submitter: Kilombino
submission: https://github.com/Kilombino/umbrel-store
