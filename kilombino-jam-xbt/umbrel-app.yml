defaultPassword: ""
releaseNotes: >-
  First release: JoinMarket-NG 0.41.0 for Bitcoin BLAKE2b (XBT) with Jam
  v2.0.0-beta.4 (XBT build xbt1), with the XBT directory preconfigured.
