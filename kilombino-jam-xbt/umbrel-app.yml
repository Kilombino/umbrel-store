releaseNotes: >-
  JoinBlaket 0.43.0-xbt7. When a collaborative send (CoinJoin) fails, Jam now
  says why on screen, in your language, instead of only "the collaborative flow
  has stopped". The send form shows the most one CoinJoin can send from the
  chosen jar: jar 0 does not combine coins that did not come from a CoinJoin
  (for your privacy), so one CoinJoin can spend at most your largest single
  coin, minus fees. Larger amounts are blocked with the way out (send less, or
  consolidate first by sending the coins to yourself without CoinJoin). The
  "wait for 5 confirmations" advice now appears only when waiting actually
  helps. From 0.43.0-xbt6: RPC filter, Jam never gets your node's RPC password.
  Your wallets are kept. Jam v2.0.0-beta.4-xbt7.
submitter: Kilombino
submission: https://github.com/Kilombino/umbrel-store
