manifestVersion: 1.3.0
id: kilombino-roblosats-coordinator
category: bitcoin
name: Roblosats Coordinator
version: "0.8.8-rl30-1"
tagline: Run your own Roblosats coordinator on Bitcoin (BLAKE2b)
description: >-
  Run a coordinator of Roblosats, the P2P exchange of the Bitcoin BLAKE2b
  chain (RoboSats for BTC), on your Umbrel: robots trade through your
  coordinator, with hold invoices on your Lightning Fork node, and you earn
  the trade fees.


  WHAT YOU GET


  The Roblosats server (the same image as the Kilobot coordinator), its
  database, its Nostr relay (synced with the rest of the federation) and its
  own Tor onion, where robots reach it. The admin panel (orders, disputes,
  rewards) opens from this tile, behind Umbrel's login, and is never served
  on the onion. User "admin", password: the one Umbrel shows for this app.


  WHAT IT NEEDS


  - Lightning XBT (this store) or Lightning Fork (PaulsCode.Com store), with
  a wallet and channels: inbound
  liquidity to receive the bonds and escrows, outbound to pay buyers. Start
  with small orders and raise the limits as your channels grow.

  - A Bitcoin node on the BLAKE2b chain, synced: Knots (BLAKE2b) Companion
  (PaulsCode.Com store), or Bitcoin Knots 29.4.3 (Horizon BTC store). Pick
  the same one Lightning Fork uses.


  EVERYTHING FROM THE TILE


  The app opens on its own page: whether Tor, Lightning Fork, the Bitcoin
  node and the server are running; your onion, Nostr key and node id; your
  channels' inbound and outbound liquidity against your largest order; a
  Settings form (name, fees, order limits, on-chain payouts, Telegram
  alerts), starting from the values Kilobot runs with; Backup, one
  encrypted file with the coordinator's onion, Nostr key, settings and
  database, to export and to restore on a new install; and Join the federation, where your node signs the request and it
  opens on GitHub filled in. Robots can use your coordinator right away by
  adding its onion; Roblosats apps and webs list it once a Roblosats release
  includes you, and the page shows "Listed in the federation" then. Settings take effect when the app restarts:
  never restart it while an order is in progress (the page tells you).


  Running a coordinator means solving disputes and keeping your node healthy:
  read the guide at
  https://github.com/Kilombino/roblosats-deploy/blob/roblosats/COORDINATOR.md
  first.
releaseNotes: >-
  Roblosats Coordinator 0.8.8-rl30-1 (same server). Runs on Lightning XBT from
  this store as well as on Paul's Lightning Fork: pick either in the app's
  node selector (Lightning XBT must be installed first). Nothing changes if you
  already use Lightning Fork.


  Roblosats Coordinator 0.8.8-rl30. When the lightning payout to a buyer
  fails, the buyer can switch to an onchain address from the "payment failed"
  screen (only if you offer onchain payouts; same swap fee and limits). Before
  paying onchain the server cancels the lightning payout, checks with LND that
  no attempt is in flight or already paid, and checks the escrow again.


  Roblosats Coordinator 0.8.8-rl29. Disputes are no longer solved
  automatically: when a chat expires with one side silent, the order goes
  to you as a dispute instead of being decided by who wrote last (the same
  change RoboSats makes in 0.8.8).


  Admin (rl28): solve a dispute with "Penalize the seller" or "Penalize the
  buyer" when there was no trade (each side gets its escrow back and only
  the one at fault loses the bond); a solved dispute shows its outcome and
  who gets what; new Failed payouts page with a count in the menu, so a
  buyer whose invoice could not be paid is not forgotten.


  Roblosats Coordinator 0.8.8-rl27-2 (same server). Settings as Kilobot
  runs them: fee 0.19 % (maker 10.5 %), orders from 101,000 to 100,000,000
  sats (also the cap on any single payout to a buyer), on-chain payouts
  from 101,000 to 6,000,000 sats and on for new installs. Values you never
  changed move to these on this update; what you changed stays, and
  on-chain payouts stay as they were. Settings shows the recommended value
  next to each field, saves only what you change, and has a button to use
  the recommended values.


  New Backup page: export one file, encrypted with your passphrase, with
  the onion's keys, the Nostr key, the secrets, your settings and the
  database; import it onto a new install (Umbrel or StartOS) to bring the
  coordinator back with the same onion, Nostr key, orders and robots. The
  relay also publishes your orders to relay.kilombino.com, as Kilobot does.


  Roblosats 0.8.8-rl27-1 (same server): Join the federation shows where
  your request stands (not sent, waiting for the next Roblosats release, or
  listed, checked against the published federation list by onion or Nostr
  key), the public data you send (name, onion, Nostr key in hex and npub,
  node id), and the request now carries the npub, how to check the node's
  signature and a ready entry for federation.json; it also asks for an
  avatar. The relay no longer shows as unhealthy (its check asked the
  wrong port).


  Roblosats 0.8.8-rl27 (coordinator panel): the order page says who won a
  resolved dispute, what the coordinator earned, the payout's routing fee
  (or on-chain txid and mining fee), links to every payment, and how many
  chat messages each side wrote and when. With one dispute waiting, the
  home's banner opens it directly. No database migration.


  Roblosats 0.8.8-rl26 (coordinator panel): every order, in progress or
  finished, has a readable page like the dispute page (amounts, both parties,
  bonds, escrow and payout, a timeline and your messages); open it from the
  new "View" column. Telegram alerts are set up from the panel: paste your bot
  token and chat id, pick the language and switch on what you want (order
  published, taken, escrow locked, finished, cancelled or expired, dispute
  opened, chat in a dispute, coordinator message sent), with a test button.
  The panel's home and menu are in 9 languages. Includes a small database
  migration that runs by itself when the app starts.


  Roblosats 0.8.8-rl25: your coordinator keeps a copy of every chat message
  again when the robots use the Nostr chat (before, only the first one was
  stored, so disputes had no chat). No database migration.


  Roblosats 0.8.8-rl24: in orders paid in Spamcoin, both sides now see the
  same Spamcoin amount. Your coordinator keeps the BTC/Spamcoin rate with 8
  decimals (with 4 it moved in ~2 % steps) and fixes the Spamcoin amount when
  the taker's bond locks. Includes a small database migration that runs by
  itself when the app starts; update with no order in progress.


  Roblosats 0.8.8-rl23: the web client served by your coordinator now
  starts new coordinators at a 25M sats order limit instead of 250k sats,
  so a young coordinator can take normal-sized orders (your own maximum
  order size still applies). No database or server changes.


  Roblosats 0.8.8-rl22: a dispute panel in the admin. For each disputed
  order it shows who buys and who sells, both statements and the chat each
  party attached; you can write to the buyer, the seller or both (app
  notification, Nostr DM, Telegram) and resolve with buttons that first show
  who receives how many sats. Disputed orders open on that page, and the
  sidebar lists open, waiting and past disputes. The admin follows your
  browser language (English, Spanish, German, French, Italian, Portuguese,
  Russian, Chinese, Japanese). No database changes.


  Roblosats 0.8.8-rl20. Fixes buyers getting an error (HTTP 500) when they
  submit their payout invoice on 0.8.8-rl18, and the trade screen of the
  coordinator's web not redrawing after an action (for example after
  Confirm fiat sent). Update if you run 0.8.8-rl18.


  Roblosats 0.8.8-rl18, based on RoboSats v0.8.8. Back up the app first: on
  start the database is migrated (under a lock) and every order's log is
  converted to the new JSON format, so going back to an older version needs
  that backup. New: upstream fixes for order race conditions, the hold
  invoice amount checked before accepting, escaped order logs, admin panel
  fixes, and the devfund node read from DEVFUND_PUBKEY (empty: the Roblosats
  maintainer's node, as before).


  Fix: the app's page (/setup/) now arrives on updates too. The app's own
  files are written by its start hook on every start, since an update only
  brings docker-compose.yml, umbrel-app.yml and hooks/.


  The app's own page: status, identity, liquidity, settings and the request
  to join the federation, all from the tile, and a "Starting" page instead of
  an error while the server starts. Installs before Lightning Fork too.


  First version (beta): the Roblosats rl15 server with the hardening of
  rl9 to rl13 (locks against simultaneous cancellations, rewards backed by
  settled bonds, payout limits, the BLAKE2b price oracle and timelocks).
