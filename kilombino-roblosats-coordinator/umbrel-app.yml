manifestVersion: 1.3.0
id: kilombino-roblosats-coordinator
category: bitcoin
name: Roblosats Coordinator
version: "0.8.7-rl15-3"
tagline: Run your own Roblosats coordinator on Bitcoin (BLAKE2b)
description: >-
  Run a coordinator of Roblosats, the P2P exchange of the Bitcoin BLAKE2b
  chain (RoboSats for BTC), on your Umbrel: robots trade through your
  coordinator, with hold invoices on your Lightning Fork node, and you earn
  the trade fees.


  WHAT YOU GET


  The Roblosats server (the same image as the Kilobot coordinator), its
  database, its Nostr relay (synced with the rest of the federation) and its
  own Tor onion, where robots reach it. The admin panel (orders, disputes,
  rewards) opens from this tile, behind Umbrel's login, and is never served
  on the onion. User "admin", password: the one Umbrel shows for this app.


  WHAT IT NEEDS


  - Lightning Fork (PaulsCode.Com store), with a wallet and channels: inbound
  liquidity to receive the bonds and escrows, outbound to pay buyers. Start
  with small orders and raise the limits as your channels grow.

  - A Bitcoin node on the BLAKE2b chain, synced: Knots (BLAKE2b) Companion
  (PaulsCode.Com store), or Bitcoin Knots 29.4.3 (Misc store). Pick the same
  one Lightning Fork uses.


  EVERYTHING FROM THE TILE


  The app opens on its own page: whether Tor, Lightning Fork, the Bitcoin
  node and the server are running; your onion, Nostr key and node id; your
  channels' inbound and outbound liquidity against your largest order; a
  Settings form (name, fees, order limits, on-chain payouts, Telegram
  alerts); and Join the federation, where your node signs the request and it
  opens on GitHub filled in. Settings take effect when the app restarts:
  never restart it while an order is in progress (the page tells you).


  Running a coordinator means solving disputes and keeping your node healthy:
  read the guide at
  https://github.com/Kilombino/roblosats-deploy/blob/roblosats/COORDINATOR.md
  first.
releaseNotes: >-
  The app's own page: status, identity, liquidity, settings and the request
  to join the federation, all from the tile, and a "Starting" page instead of
  an error while the server starts. Installs before Lightning Fork too.


  First version (beta): the Roblosats rl15 server with the hardening of
  rl9 to rl13 (locks against simultaneous cancellations, rewards backed by
  settled bonds, payout limits, the BLAKE2b price oracle and timelocks).
