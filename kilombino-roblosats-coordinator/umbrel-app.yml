manifestVersion: 1.3.0
id: kilombino-roblosats-coordinator
category: bitcoin
name: Roblosats Coordinator
version: "0.9.16"
tagline: Run your own Roblosats coordinator on Bitcoin (BLAKE2b)
description: >-
  Run a coordinator of Roblosats, the P2P exchange of the Bitcoin BLAKE2b
  chain (RoboSats for BTC), on your Umbrel: robots trade through your
  coordinator, with hold invoices on your Lightning Fork node, and you earn
  the trade fees.


  WHAT YOU GET


  The Roblosats server (the same image as the Kilobot coordinator), its
  database, its Nostr relay (synced with the rest of the federation) and its
  own Tor onion, where robots reach it. The admin panel (orders, disputes,
  rewards) opens from this tile, behind Umbrel's login, and is never served
  on the onion. User "admin", password: the one Umbrel shows for this app.


  WHAT IT NEEDS


  - Lightning XBT (this store) or Lightning Fork (PaulsCode.Com store), with
  a wallet and channels: inbound
  liquidity to receive the bonds and escrows, outbound to pay buyers. Start
  with small orders and raise the limits as your channels grow.

  - A Bitcoin node on the BLAKE2b chain, synced: Knots (BLAKE2b) Companion
  (PaulsCode.Com store), or Bitcoin Knots 29.4.3 (Horizon BTC store). Pick
  the same one Lightning Fork uses.


  OPTIONAL: ON-CHAIN ESCROW


  Lightning-only by default. Since Roblosats 0.9.0 you can also offer
  non-custodial on-chain orders: switch "On-chain escrow" on in Settings
  with an address of your own wallet on the BLAKE2b chain (your fees and bond
  penalties go there), the order limits (20,000 to 101,000 sats to start),
  optionally a list of robots allowed to use them, and the rescue timelock
  (2016 blocks). The app then makes an escrow secret, kept with the
  coordinator's other secrets and never shown: the keys of every on-chain
  escrow and bond come from it and from your coordinator name. It is in the
  app's encrypted backup and in Umbrel's backups; export a new backup after
  switching on, because losing the secret means you can no longer co-sign
  open escrows. The coordinator keeps a watch-only wallet (no private keys)
  on your Bitcoin node to follow deposits and bonds; the node needs wallet
  support.


  EVERYTHING FROM THE TILE


  The app opens on its own page: whether Tor, Lightning Fork, the Bitcoin
  node and the server are running; your onion, Nostr key and node id; your
  channels' inbound and outbound liquidity against your largest order; a
  Settings form (name, fees, order limits, on-chain payouts, Telegram
  alerts), starting from the values Kilobot runs with; Backup, one
  encrypted file with the coordinator's onion, Nostr key, settings and
  database, to export and to restore on a new install; and Join the federation, where your node signs the request and it
  opens on GitHub filled in. Robots can use your coordinator right away by
  adding its onion; Roblosats apps and webs list it once a Roblosats release
  includes you, and the page shows "Listed in the federation" then. Settings take effect when the app restarts:
  never restart it while an order is in progress (the page tells you).


  Running a coordinator means solving disputes and keeping your node healthy:
  read the guide at
  https://github.com/Kilombino/roblosats-deploy/blob/roblosats/COORDINATOR.md
  first.
releaseNotes: >-
  Roblosats Coordinator 0.9.16. Dispute winners (and the innocent side of a
  penalty) now also get SLASHED_BOND_REWARD_SPLIT of the loser's bond in
  Lightning-escrow orders (pure Lightning, Hybrid B, Hybrid C), as on-chain
  escrows already did; the dispute page shows the share and how the lost bond
  is split. New "At a glance" panel on the dispute page. Admin translations
  fixed (de/fr/it/ru). No database migrations: going back to 0.9.15 is safe.


  Roblosats Coordinator 0.9.15 ("Stats for Nerds"). The 24 h contracted volume
  counts trades paid in Spamcoin and contracts taken with an onchain bond
  (they never logged a market tick); ticks of 1 BTC or more and Spamcoin
  prices now fit (migration 0075, it only widens two columns). The image
  records its commit, linked from the app; your Lightning node links to its
  Nodex page. Going back to 0.9.14 is safe.


  Roblosats Coordinator 0.9.14. Where onchain escrow is on, a Lightning order
  can be taken with an onchain bond: by the buyer (Hybrid C: the trade stays
  Lightning, only its bond is on chain) or by the seller (Hybrid D: the order
  becomes an onchain-escrow order and the maker keeps its Lightning bond),
  with the same race as onchain orders (the order stays in the book, 3 h from
  the mempool, first bond locked wins); ESCROW_ONCHAIN_TAKER=False turns it
  off. The maker sees onchain takes on their way; a robot whose bond just
  confirmed is told at once to sign. Disputes: the chat is attached by
  default, or once afterwards (you get an alert). Alerts give the exact amount
  the screen asks for. Two additive database migrations (0073, 0074): finish
  or cancel orders taken on chain before going back to 0.9.12.


  Roblosats Coordinator 0.9.12. An onchain bond is no longer penalized when a
  dispute opens: it waits for your decision (back to its owner on chain, or
  penalized then), with a safety penalty before its timelock. Penalties use a
  fee ladder (ESCROW_PENALTY_RATES). A new watch tells robots, and you
  (on-chain alert group), when Spamcoin (SHA-256) lands on an onchain bond or
  funding address by mistake (mempool.space onion over Tor; SPAMCHAIN_WATCH
  False turns it off). The relay federation filter of 0.9.11-1 is kept. One
  additive database migration (0072): going back to 0.9.11 is safe.


  Roblosats Coordinator 0.9.11-1 (packaging only, same server image). Relay
  federation filter: the coordinator's Nostr relay now stores order events
  (kind 38383) only from the coordinators of the Roblosats federation, and
  ratings (31986) only of them; its sync with the other relays asks only for
  those, and no longer copies chat wraps (1059) from them (robots publish
  their chats straight to each coordinator's relay). The coordinator list
  follows the official federation.json by itself, checked every hour: a new
  coordinator is accepted with no update of this app, and on any error the
  last good list stays. Your own coordinator is always in the list, even
  before federation.json lists it. Orders of other federations stored earlier
  are dropped once. The list is data/relay/allowed-order-pubkeys.txt; a line
  "manual" in it stops the updates.


  Roblosats Coordinator 0.9.11. Nostr order book: events of orders that
  left the book are accepted by the relay (an expired order's update carried
  a past expiration and stayed listed), with NIP-69 statuses and a NIP-09
  deletion. Automatic bond returns: a fee ladder (ESCROW_AUTO_RETURN_RATES,
  default 1,3 sat/vB), the cheapest rung the mempool needs, bumped by RBF if
  it gets stuck. The Android app gains a Clearnet mode (beta): if your
  coordinator has a clearnet URL in federation.json, phones in that mode
  reach it directly (and see its IP). No database migrations.

  Roblosats Coordinator 0.9.10. On-chain disputes: "penalize the seller /
  buyer (no trade)" and "trade completed" now work on chain too, explained on
  the dispute page like the other decisions (who signs, who gets what at which
  address). Robots' notices can carry your clearnet order link
  (CLEARNET_ORDER_URL, empty by default). Swap payouts from 1 sat/vB
  (PAYOUT_MIN_FEE_RATE). The robots' chat reconnects after a relay drop (app
  side). No database migrations.


  Roblosats Coordinator 0.9.9-1 (server only). On-chain disputes can be
  resolved from the dispute page: it checks what the on-chain escrow needs and
  says, with the same numbers the release will use, who gets how many sats at
  which address, whose app must sign and what you keep; then it shows whose
  signature is still missing and the release. A hybrid order's settled
  Lightning taker bond comes back as rewards on "return everything". The
  trader who does not sign a dispute release now waits for the other instead
  of seeing "signing together". The admin panel is also in Catalan. No
  database migrations.


  Roblosats Coordinator 0.9.9. Payout, refund and bond return addresses can
  also be legacy (1…) and P2SH (3…); outputs use the dust threshold of each
  address type at your node's dust relay fee. A seller's leftover funding goes
  back to its payout address inside the deposit. Fair deadline: when a trader
  finishes its part of the on-chain setup, the other gets at least an hour.
  The order and dispute pages list the traders' addresses and every deposit
  and release output with its type. One migration (0071) that only records
  validators: no change to the database.


  Roblosats Coordinator 0.9.8. When another taker locks first (a Lightning
  bond locks in seconds, an on-chain one needs a confirmation), the other
  pending on-chain takes end at once: their bonds are freed (never
  penalized) and their robots are told; a robot whose take is over sees only
  its bond on the order page and takes it back from there. Two on-chain
  taker bonds locking at the same moment go to the robot that took first.
  No database migrations.


  Roblosats Coordinator 0.9.7-1, panels. Settings: three on-chain settings
  the server already had are now on the page with their recommended values
  (Lightning takes of on-chain orders, the smallest on-chain fee for you, the
  lowest deposit fee rate); the on-chain card says the one-signature release
  and the automatic bond return are always on. Admin panel: the dispute page
  shows the on-chain section too; the order page shows how the release was
  signed, the hybrid plan, each bond's automatic return and whether the
  release and the on-chain payout are in the mempool or confirmed; Spamcoin
  orders say Spamcoin; Failed payouts lists on-chain payouts still queued; a
  new Telegram alert tells you when a free bond did not go back by itself.
  New Telegram alert groups, each with its own switch in admin panel →
  Telegram alerts: on-chain order events (bonds and deposits in the mempool
  and confirmed, deposit signed, release, automatic bond returns, swap
  payouts, rescues) and your node's on-chain wallet (payments in and out,
  channel opens and closes, high mining fees). Nothing old is sent when you
  switch them on. Alerts can now be in Catalan. One small migration of the
  admin app, applied on start.

  Roblosats Coordinator 0.9.7. A free onchain bond goes back by itself: the
  owner's app pre-signs the return to its return or payout address with the
  penalty, and your coordinator broadcasts it only once the bond is free
  (never while it can be penalized or is in a deposit); otherwise the manual
  return works as before. The order summary shows each onchain payout as in
  the mempool or confirmed. A sat order paid only with Spamcoin is kept in
  Spamcoin. One database migration (0070), applied on start: update with no
  order in progress.


  Roblosats Coordinator 0.9.5 (includes 0.9.4). On-chain orders: the
  seller's app signs the cooperative release alone through its leaf with
  your coordinator, which adds its signature and broadcasts; the buyer signs
  nothing and nobody has to come back for a second round. Releases started
  with older apps can be finished the same way. New mixed orders where the
  buyer took with Lightning use the seller's own rescue, so the buyer signs
  nothing on-chain. From 0.9.4: a notice for every step of an order
  (Telegram, Nostr and webhook, in English, Spanish or Catalan) and
  reminders 30 and 10 minutes before every deadline. No database migration;
  older escrows and older apps keep working.


  Roblosats Coordinator 0.9.3, recommended if you switched on on-chain
  escrow. An on-chain order could stay stuck before the deposit ("the
  seller's funding is short by N sats" on every loop) when the seller sent
  exactly the amount it was shown: the deposit now pays the highest fee rate
  the funding covers, down to 1 sat/vB, instead of asking for more. Taking an
  on-chain order on-chain after a cancelled Lightning take works again, the
  app is told what already confirmed at its funding address, and a robot
  whose signature is still missing after 90 seconds is reminded (Telegram,
  Nostr or webhook). No database migration; Lightning-only coordinators are
  not affected.


  Roblosats Coordinator 0.9.0: optional non-custodial on-chain escrow.
  Nothing changes unless you switch it on: your coordinator stays
  Lightning-only. Settings has a new "On-chain escrow (optional)" section:
  switch, your fee and penalty address (checked), on-chain order limits
  (20,000 to 101,000 sats), robots allowed (empty = everyone) and the rescue
  timelock (2016 blocks). Switching on makes the escrow secret (never shown)
  and the watch-only wallet on your Bitcoin node; the secret is in the app's
  encrypted backup: export a new one after switching on. The status page
  shows the on-chain state. Also in 0.9.0: fixed-price and "丰 sat" orders,
  past orders and a final summary for robots, an on-chain view in the admin
  panel, and many fixes. The database is migrated when the app starts
  (0063 to 0069): update with no order in progress and export a backup first.


  Roblosats Coordinator 0.8.8-rl30-1 (same server). Runs on Lightning XBT from
  this store as well as on Paul's Lightning Fork: pick either in the app's
  node selector (Lightning XBT must be installed first). Nothing changes if you
  already use Lightning Fork.


  Roblosats Coordinator 0.8.8-rl30. When the lightning payout to a buyer
  fails, the buyer can switch to an onchain address from the "payment failed"
  screen (only if you offer onchain payouts; same swap fee and limits). Before
  paying onchain the server cancels the lightning payout, checks with LND that
  no attempt is in flight or already paid, and checks the escrow again.


  Roblosats Coordinator 0.8.8-rl29. Disputes are no longer solved
  automatically: when a chat expires with one side silent, the order goes
  to you as a dispute instead of being decided by who wrote last (the same
  change RoboSats makes in 0.8.8).


  Admin (rl28): solve a dispute with "Penalize the seller" or "Penalize the
  buyer" when there was no trade (each side gets its escrow back and only
  the one at fault loses the bond); a solved dispute shows its outcome and
  who gets what; new Failed payouts page with a count in the menu, so a
  buyer whose invoice could not be paid is not forgotten.


  Roblosats Coordinator 0.8.8-rl27-2 (same server). Settings as Kilobot
  runs them: fee 0.19 % (maker 10.5 %), orders from 101,000 to 100,000,000
  sats (also the cap on any single payout to a buyer), on-chain payouts
  from 101,000 to 6,000,000 sats and on for new installs. Values you never
  changed move to these on this update; what you changed stays, and
  on-chain payouts stay as they were. Settings shows the recommended value
  next to each field, saves only what you change, and has a button to use
  the recommended values.


  New Backup page: export one file, encrypted with your passphrase, with
  the onion's keys, the Nostr key, the secrets, your settings and the
  database; import it onto a new install (Umbrel or StartOS) to bring the
  coordinator back with the same onion, Nostr key, orders and robots. The
  relay also publishes your orders to relay.kilombino.com, as Kilobot does.


  Roblosats 0.8.8-rl27-1 (same server): Join the federation shows where
  your request stands (not sent, waiting for the next Roblosats release, or
  listed, checked against the published federation list by onion or Nostr
  key), the public data you send (name, onion, Nostr key in hex and npub,
  node id), and the request now carries the npub, how to check the node's
  signature and a ready entry for federation.json; it also asks for an
  avatar. The relay no longer shows as unhealthy (its check asked the
  wrong port).


  Roblosats 0.8.8-rl27 (coordinator panel): the order page says who won a
  resolved dispute, what the coordinator earned, the payout's routing fee
  (or on-chain txid and mining fee), links to every payment, and how many
  chat messages each side wrote and when. With one dispute waiting, the
  home's banner opens it directly. No database migration.


  Roblosats 0.8.8-rl26 (coordinator panel): every order, in progress or
  finished, has a readable page like the dispute page (amounts, both parties,
  bonds, escrow and payout, a timeline and your messages); open it from the
  new "View" column. Telegram alerts are set up from the panel: paste your bot
  token and chat id, pick the language and switch on what you want (order
  published, taken, escrow locked, finished, cancelled or expired, dispute
  opened, chat in a dispute, coordinator message sent), with a test button.
  The panel's home and menu are in 9 languages. Includes a small database
  migration that runs by itself when the app starts.


  Roblosats 0.8.8-rl25: your coordinator keeps a copy of every chat message
  again when the robots use the Nostr chat (before, only the first one was
  stored, so disputes had no chat). No database migration.


  Roblosats 0.8.8-rl24: in orders paid in Spamcoin, both sides now see the
  same Spamcoin amount. Your coordinator keeps the BTC/Spamcoin rate with 8
  decimals (with 4 it moved in ~2 % steps) and fixes the Spamcoin amount when
  the taker's bond locks. Includes a small database migration that runs by
  itself when the app starts; update with no order in progress.


  Roblosats 0.8.8-rl23: the web client served by your coordinator now
  starts new coordinators at a 25M sats order limit instead of 250k sats,
  so a young coordinator can take normal-sized orders (your own maximum
  order size still applies). No database or server changes.


  Roblosats 0.8.8-rl22: a dispute panel in the admin. For each disputed
  order it shows who buys and who sells, both statements and the chat each
  party attached; you can write to the buyer, the seller or both (app
  notification, Nostr DM, Telegram) and resolve with buttons that first show
  who receives how many sats. Disputed orders open on that page, and the
  sidebar lists open, waiting and past disputes. The admin follows your
  browser language (English, Spanish, German, French, Italian, Portuguese,
  Russian, Chinese, Japanese). No database changes.


  Roblosats 0.8.8-rl20. Fixes buyers getting an error (HTTP 500) when they
  submit their payout invoice on 0.8.8-rl18, and the trade screen of the
  coordinator's web not redrawing after an action (for example after
  Confirm fiat sent). Update if you run 0.8.8-rl18.


  Roblosats 0.8.8-rl18, based on RoboSats v0.8.8. Back up the app first: on
  start the database is migrated (under a lock) and every order's log is
  converted to the new JSON format, so going back to an older version needs
  that backup. New: upstream fixes for order race conditions, the hold
  invoice amount checked before accepting, escaped order logs, admin panel
  fixes, and the devfund node read from DEVFUND_PUBKEY (empty: the Roblosats
  maintainer's node, as before).


  Fix: the app's page (/setup/) now arrives on updates too. The app's own
  files are written by its start hook on every start, since an update only
  brings docker-compose.yml, umbrel-app.yml and hooks/.


  The app's own page: status, identity, liquidity, settings and the request
  to join the federation, all from the tile, and a "Starting" page instead of
  an error while the server starts. Installs before Lightning Fork too.


  First version (beta): the Roblosats rl15 server with the hardening of
  rl9 to rl13 (locks against simultaneous cancellations, rewards backed by
  settled bonds, payout limits, the BLAKE2b price oracle and timelocks).
developer: Kilombino
website: https://roblosats.kilombino.com
# Paul's Lightning Fork, or Lightning XBT from this store, which declares
# `implements: [paulscode-lightning-fork]`: umbrelOS offers whichever is installed.
dependencies:
  - paulscode-lightning-fork
  - bitcoin
repo: https://github.com/Kilombino/roblosats
support: https://t.me/roblosats
# Clear of the PaulsCode.Com store's tiles (7150-7156) and the other apps of this store.
port: 7167
icon: https://raw.githubusercontent.com/Kilombino/umbrel-store/master/kilombino-roblosats-coordinator/icon.png
gallery:
  - https://raw.githubusercontent.com/Kilombino/umbrel-store/master/kilombino-roblosats/1.jpg
path: "/setup/"
defaultUsername: "admin"
deterministicPassword: true
submitter: Kilombino
submission: https://github.com/Kilombino/umbrel-store
