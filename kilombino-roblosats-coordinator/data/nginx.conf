# Port 80: the public coordinator, reached only through its onion (Tor → 127.0.0.1:80).
# Port 81: Umbrel's tile (behind Umbrel's login): the same, plus the admin panel.
limit_req_zone $binary_remote_addr zone=tenpersec:10m rate=100r/s;
map $request_method $order_post_robot {
    POST    $http_authorization;
    default "";
}
limit_conn_zone $order_post_robot zone=order_post_per_robot:10m;

upstream robosats_gunicorn_rest {
    server 127.0.0.1:8000;
}
upstream robosats_daphne_websocket {
    server 127.0.0.1:9000;
}

server {
    listen 127.0.0.1:80;
    server_name coordinator;
    large_client_header_buffers 4 64k;

    location /static {
        alias /usr/src/static;
    }

    # The admin panel is never on the onion: only through Umbrel (port 81).
    location /coordinator {
        return 403;
    }

    location /api/order {
        proxy_pass http://robosats_gunicorn_rest;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        limit_req zone=tenpersec burst=10;
        limit_conn order_post_per_robot 1;
        limit_conn_status 429;
    }

    location / {
        proxy_pass http://robosats_gunicorn_rest;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        limit_req zone=tenpersec burst=10;
    }

    location /ws/ {
        proxy_pass http://robosats_daphne_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        limit_req zone=tenpersec burst=10;
    }

    location /relay {
        proxy_pass http://127.0.0.1:7778;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}

server {
    listen 81;
    server_name umbrel;
    large_client_header_buffers 4 64k;

    location /static {
        alias /usr/src/static;
    }

    # Django sees the tile as "localhost", whatever name or address the browser used.
    location / {
        proxy_pass http://robosats_gunicorn_rest;
        proxy_set_header Host localhost;
        proxy_set_header Origin http://localhost;
        proxy_set_header Referer "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect http://localhost/ /;
    }

    location /ws/ {
        proxy_pass http://robosats_daphne_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host localhost;
    }
}
