version: "3.7"

# A Roblosats coordinator on Umbrel: the Roblosats server (Django, Daphne, Celery and the order
# and invoice loops), PostgreSQL, Redis, nginx, a Nostr relay and its own Tor onion, all in the
# network namespace of the tor service (they talk on 127.0.0.1, as in the upstream deployment).
# Lightning: Lightning Fork (PaulsCode.Com store), read-only credentials. Chain: the node picked
# for the "bitcoin" dependency (on the BLAKE2b chain), for addresses of on-chain payouts.

x-roblosats: &roblosats
  image: ghcr.io/kilombino/roblosats-coordinator:0.8.7-rl15@sha256:4c50bb928333249ec45471eaa09b2fc1e0a76ccc3a02cd468306191387829c87
  restart: on-failure
  network_mode: service:tor
  entrypoint: ["/umbrel/run.sh"]
  # secrets.env is made by hooks/pre-start, which Umbrel runs after pulling the images: optional
  # here so the pull does not stop on it.
  env_file:
    - ${APP_DATA_DIR}/data/settings.env
    - path: ${APP_DATA_DIR}/data/secrets.env
      required: false
    # What the app's Settings page saves (data/panel.py), over settings.env.
    - path: ${APP_DATA_DIR}/data/panel/settings.local.env
      required: false
  volumes:
    - ${APP_DATA_DIR}/data/run.sh:/umbrel/run.sh:ro
    - ${APP_DATA_DIR}/data/tor:/tor:ro
    - ${APP_DATA_DIR}/data/static:/usr/src/static
    # Until Lightning Fork is installed, an empty directory: run.sh waits for its credentials.
    - ${APP_LIGHTNING_FORK_NODE_DATA_DIR:-${APP_DATA_DIR}/data/no-lightning-fork}:/lnd:ro
  environment: &env
    SKIP_COLLECT_STATIC: "true"
    LNVENDOR: LND
    LND_GRPC_HOST: "${APP_LIGHTNING_FORK_NODE_IP:-127.0.0.1}:${APP_LIGHTNING_FORK_NODE_GRPC_PORT:-10010}"
    # The node is whichever app the user picked for the "bitcoin" dependency, as Lightning Fork
    # does (Knots (BLAKE2b) Companion, or Bitcoin Knots 29.4.1 or later): run.sh takes the first
    # set with an address and a port.
    NODE_KNOTS_BLAKE2B_IP: "${APP_KNOTS_BLAKE2B_NODE_IP:-}"
    NODE_KNOTS_BLAKE2B_PORT: "${APP_KNOTS_BLAKE2B_RPC_PORT:-}"
    NODE_KNOTS_BLAKE2B_USER: "${APP_KNOTS_BLAKE2B_RPC_USER:-}"
    NODE_KNOTS_BLAKE2B_PASS: "${APP_KNOTS_BLAKE2B_RPC_PASS:-}"
    NODE_BITCOIN_KNOTS_IP: "${APP_BITCOIN_KNOTS_NODE_IP:-}"
    NODE_BITCOIN_KNOTS_PORT: "${APP_BITCOIN_KNOTS_RPC_PORT:-}"
    NODE_BITCOIN_KNOTS_USER: "${APP_BITCOIN_KNOTS_RPC_USER:-}"
    NODE_BITCOIN_KNOTS_PASS: "${APP_BITCOIN_KNOTS_RPC_PASS:-}"
    NODE_BITCOIN_IP: "${APP_BITCOIN_NODE_IP:-}"
    NODE_BITCOIN_PORT: "${APP_BITCOIN_RPC_PORT:-}"
    NODE_BITCOIN_USER: "${APP_BITCOIN_RPC_USER:-}"
    NODE_BITCOIN_PASS: "${APP_BITCOIN_RPC_PASS:-}"
    REDIS_URL: redis://127.0.0.1:6379/1
    POSTGRES_DB: roblosats
    POSTGRES_USER: roblosats
    POSTGRES_HOST: 127.0.0.1
    POSTGRES_PORT: "5432"
    USE_TOR: "True"
    TOR_PROXY: 127.0.0.1:9050
    STRFRY_HOST: 127.0.0.1
    STRFRY_PORT: "7778"
    NETWORK: mainnet
    # Price of Bitcoin (BLAKE2b): NonKYC and Neoxa, through mempool.kilombino.com (they block Tor).
    MARKET_PRICE_APIS: https://mempool.kilombino.com/nonkyc-ticker
    NEOXA_TICKER_URL: https://mempool.kilombino.com/neoxa-ticker
    MEMPOOL_FEES_URL: https://mempool.kilombino.com
    BTCB2_FALLBACK_USD: "300"
    I2P_ALIAS: ""
    I2P_LONG: ""
    GEOBLOCKED_COUNTRIES: ""
    ALTERNATIVE_SITE: ""
    ALTERNATIVE_NAME: ""
    CHAT_NOTIFICATION_TIMEGAP: "5"
    PENALTY_TIMEOUT: "60"
    RETRY_TIME: "1"
    # BLAKE2b blocks come every ~9 minutes, with bursts: the hold invoices' timelocks count on it.
    BLOCK_TIME: "6"
    MAX_MINING_NETWORK_SPEEDUP_EXPECTED: "2.0"
    EXP_MAKER_BOND_INVOICE: "300"
    EXP_TAKER_BOND_INVOICE: "200"
    PROPORTIONAL_ROUTING_FEE_LIMIT: "0.001"
    MIN_FLAT_ROUTING_FEE_LIMIT_REWARD: "2"
    REWARDS_TIMEOUT_SECONDS: "30"
    PAYOUT_TIMEOUT_SECONDS: "90"
    DEBUG_PERMISSIONED_PAYOUTS: "False"
    ALLOW_SELF_KEYSEND: "False"
    SWAP_FEE_SHAPE: exponential
    SWAP_LAMBDA: "8.8"
    MIN_SWAP_FEE: "0.008"
    MAX_SWAP_FEE: "0.1"
    SPEND_UNCONFIRMED: "False"
    SUGGESTED_TARGET_CONF: "4"
    MINIMUM_TARGET_CONF: "24"
    SLASHED_BOND_REWARD_SPLIT: "0.5"
    ESCROW_USERNAME: admin
    DISABLE_ORDER_LOGS: "False"
    # Rewards and payouts (Roblosats hardening): limits on what can leave.
    HOLD_SLASHED_RETURN_ABOVE: "20000"
    REWARD_WITHDRAW_DELAY: "3600"
    REWARD_WITHDRAW_DAILY_MAX: "250000"
    REWARD_WITHDRAW_COOLDOWN: "86400"
    REWARD_WITHDRAW_GLOBAL_DAILY_MAX: "500000"

services:
  app_proxy:
    environment:
      APP_HOST: kilombino-roblosats-coordinator_tor_1
      APP_PORT: 81

  tor:
    image: ghcr.io/kilombino/roblosats-tor:0.4-2@sha256:baaa176cd78c2a837d8249a12f19ab34f772791d8a70dbe91a04970dbb4616d9
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/tor:/var/lib/tor
      - ${APP_DATA_DIR}/data/torrc:/etc/tor/torrc:ro

  postgres:
    image: postgres:14.2-alpine@sha256:20e49432a20e1a63bb985977c32ec8f110bc609b93de35ad4f19c5486abcefaa
    restart: on-failure
    network_mode: service:tor
    env_file:
      - path: ${APP_DATA_DIR}/data/secrets.env
        required: false
    environment:
      POSTGRES_USER: roblosats
      POSTGRES_DB: roblosats
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.2.1-alpine@sha256:a4c910678a1b358a88446b2fe1c5bb0417a5c9cfac4eba959f1e42d22f2e0af1
    restart: on-failure
    network_mode: service:tor
    command: ["redis-server", "--bind", "127.0.0.1", "--save", ""]

  robosats:
    <<: *roblosats
    environment:
      <<: *env
      ROBLOSATS_ROLE: main
      SKIP_COLLECT_STATIC: ""
      ADMIN_PASSWORD: "${APP_PASSWORD}"
      LOG_TO_CONSOLE: "1"
    command: ["gunicorn", "--bind", "127.0.0.1:8000", "--max-requests", "1000", "--max-requests-jitter", "200", "-w", "2", "robosats.wsgi:application"]
    # An order in progress holds hold invoices: give everything time to stop cleanly.
    stop_grace_period: 1m

  daphne:
    <<: *roblosats
    command: ["daphne", "-b", "127.0.0.1", "-p", "9000", "robosats.asgi:application"]

  clean-orders:
    <<: *roblosats
    command: ["python3", "manage.py", "clean_orders"]

  follow-invoices:
    <<: *roblosats
    command: ["python3", "manage.py", "follow_invoices"]
    stop_grace_period: 1m

  telegram-watcher:
    <<: *roblosats
    command: ["python3", "manage.py", "telegram_watcher"]

  celery:
    <<: *roblosats
    command: ["celery", "-A", "robosats", "worker", "--loglevel=WARNING"]
    stop_grace_period: 1m

  celery-beat:
    <<: *roblosats
    command: ["celery", "-A", "robosats", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]

  # The app's own page on the tile (/setup/): status, identity, liquidity, settings, and the
  # request to join the federation, signed by the node. Never on the onion.
  panel:
    <<: *roblosats
    entrypoint: ["python3", "/umbrel/panel.py"]
    command: []
    volumes:
      - ${APP_DATA_DIR}/data/panel.py:/umbrel/panel.py:ro
      - ${APP_DATA_DIR}/data/settings.env:/umbrel/settings.env:ro
      - ${APP_DATA_DIR}/data/panel:/umbrel/panel
      - ${APP_DATA_DIR}/data/tor:/tor:ro
      - ${APP_LIGHTNING_FORK_NODE_DATA_DIR:-${APP_DATA_DIR}/data/no-lightning-fork}:/lnd:ro

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: on-failure
    network_mode: service:tor
    volumes:
      - ${APP_DATA_DIR}/data/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_DATA_DIR}/data/static:/usr/src/static:ro

  relay:
    image: ghcr.io/kilombino/roblosats-relay:1.1.3-3@sha256:607980f2276c21dc2276828287e1d43ba85d5b0c76e2a8032e8c49e54c515dc7
    restart: on-failure
    network_mode: service:tor
    environment:
      TOR_PROXY: 127.0.0.1:9050
    volumes:
      - ${APP_DATA_DIR}/data/strfry.conf:/etc/strfry.conf:ro
      - ${APP_DATA_DIR}/data/federation_urls.txt:/app/federation_urls.txt:ro
      - ${APP_DATA_DIR}/data/relay:/app/strfry-db
