# Port 80: the public coordinator, reached only through its onion (Tor → 127.0.0.1:80).
# Port 81: Umbrel's tile (behind Umbrel's login): the same, plus the admin panel.
limit_req_zone $binary_remote_addr zone=tenpersec:10m rate=100r/s;
map $request_method $order_post_robot {
    POST    $http_authorization;
    default "";
}
limit_conn_zone $order_post_robot zone=order_post_per_robot:10m;

upstream robosats_gunicorn_rest {
    server 127.0.0.1:8000;
}
upstream robosats_daphne_websocket {
    server 127.0.0.1:9000;
}

server {
    listen 127.0.0.1:80;
    server_name coordinator;
    large_client_header_buffers 4 64k;

    location /static {
        alias /usr/src/static;
    }

    # The admin panel is never on the onion: only through Umbrel (port 81).
    location /coordinator {
        return 403;
    }

    location /api/order {
        proxy_pass http://robosats_gunicorn_rest;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        limit_req zone=tenpersec burst=10;
        limit_conn order_post_per_robot 1;
        limit_conn_status 429;
    }

    location / {
        proxy_pass http://robosats_gunicorn_rest;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        limit_req zone=tenpersec burst=10;
    }

    location /ws/ {
        proxy_pass http://robosats_daphne_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        limit_req zone=tenpersec burst=10;
    }

    location /relay {
        proxy_pass http://127.0.0.1:7778;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}

server {
    listen 81;
    server_name umbrel;
    # Relative redirects: the browser reaches this through Umbrel's proxy, on another port.
    absolute_redirect off;
    large_client_header_buffers 4 64k;

    location /static {
        alias /usr/src/static;
    }

    # The app's own page (panel.py); the tile opens on it.
    location = / {
        return 302 /setup/;
    }
    location /setup/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host localhost;
        error_page 502 503 504 = @starting;
    }

    # While the Roblosats server starts, a page that says so and reloads itself, instead of a 502.
    location @starting {
        default_type text/html;
        add_header Cache-Control no-store always;
        return 200 '<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta http-equiv=refresh content=5><title>Starting</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#e6e8ee;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:16px}@media (prefers-color-scheme:light){body{background:#f6f7f9;color:#15181e}}.s{width:36px;height:36px;margin:0 auto 16px;border:3px solid #8b7cf633;border-top-color:#8b7cf6;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{opacity:.7;max-width:420px}</style></head><body><div><div class=s></div><h2>Starting the coordinator…</h2><p>It waits for Tor, Lightning Fork and its database. The first start takes a few minutes. This page reloads by itself.</p><p><a href=/setup/ style="color:#8b7cf6">Status</a></p></div></body></html>';
    }

    # Django sees the tile as "localhost", whatever name or address the browser used.
    location / {
        error_page 502 503 504 = @starting;
        # A way back to the app's page from every admin page.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</body>' '<a href="/setup/" style="position:fixed;right:16px;bottom:16px;z-index:9999;padding:9px 14px;border-radius:10px;background:#8b7cf6;color:#fff;font:600 14px system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px #0005">&#9881; Setup</a></body>';
        proxy_pass http://robosats_gunicorn_rest;
        proxy_set_header Host localhost;
        proxy_set_header Origin http://localhost;
        proxy_set_header Referer "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect http://localhost/ /;
    }

    location /ws/ {
        proxy_pass http://robosats_daphne_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host localhost;
    }
}
