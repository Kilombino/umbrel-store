manifestVersion: 1.1
id: kilombino-thunderhub-xbt
category: lightning
name: ThunderHub XBT
version: "0.19.0-xbt.3.1"
tagline: ThunderHub for Lightning on the Bitcoin BLAKE2b chain
description: >-
  ThunderHub XBT is ThunderHub, the LND node manager, forked for the Bitcoin
  BLAKE2b chain (BTC). It manages a Lightning Fork node: channels, payments,
  forwards, fees, rebalancing and reports, with everything that pointed at the
  SHA-256 chain pointed at this one instead.


  WHAT CHANGES FROM THUNDERHUB


  Fiat prices of BTCB2 come from Neoxa, where it trades, not the SHA-256
  chain's price. Transactions, addresses, fee rates and block height come from
  mempool.kilombino.com, which follows the BLAKE2b chain. Node and channel
  links open lightning.paperclippool.xyz. Amboss and Magma, which belong to
  the other chain's Lightning network, are removed. It adds notes on
  channels, coin control when opening channels, CPFP, and a Spanish
  interface.


  WHICH NODE IT NEEDS


  A Lightning node on the BLAKE2b chain: Lightning XBT from this store, or
  Paul's Lightning Fork from the PaulsCode.Com community store
  (https://github.com/paulscode/umbrel-store). Lightning XBT is Lightning Fork
  packaged for this store, and stands in for it: install it first and it is
  offered in this app's node selector. The official Lightning Node app follows
  the SHA-256 chain and is not used. ThunderHub XBT can be installed beside
  the official ThunderHub.
developer: Kilombino
website: https://github.com/Kilombino/thunderhub/tree/xbt
# Paul's Lightning Fork, or Lightning XBT from this store, which declares
# `implements: [paulscode-lightning-fork]`: umbrelOS offers whichever of the two
# is installed, and docker-compose.yml reads the picked one's variables.
dependencies:
  - paulscode-lightning-fork
repo: https://github.com/Kilombino/thunderhub
support: https://t.me/Kilombino
# Clear of the official ThunderHub (3000) and of the PaulsCode.Com store's tiles.
port: 7160
icon: https://raw.githubusercontent.com/Kilombino/umbrel-store/master/kilombino-thunderhub-xbt/icon.png
gallery: []
path: ""
defaultUsername: ""
deterministicPassword: true
releaseNotes: >-
  Works with Lightning XBT from this store as well as with Paul's Lightning
  Fork: pick either in the app's node selector (Lightning XBT must be installed
  first). Nothing changes if you already use Lightning Fork. The app now sits in
  the Lightning category of the App Store.


  From 0.19.0-xbt.3: pay Lightning Addresses: in Lightning → Send, paste a Lightning Address
  (user@domain, e.g. zap@kilombino.com) in the invoice box, choose the amount
  (and a comment if the service allows it) and the max fee, then pay, same as
  BOLT 12 offers. The invoice must be for exactly the amount you chose or
  nothing is paid. Also new: BOLT 12 payment receipts (offer, payee-signed
  invoice and preimage), shown after paying and from the history with the
  signature and preimage checked, ready to copy or download.
submitter: Kilombino
submission: https://github.com/Kilombino/umbrel-store
