version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kilombino-kilowallet_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/kilombino/kilowallet-server:0.9.0@sha256:f9d5db293e9957e343e7ec269cd07a68208b64bfd067ff05235edee23956bed8
    user: "1000:1000"
    restart: on-failure
    # A coinjoin round or the Ark engine may be writing its state when stopped.
    stop_grace_period: 1m
    volumes:
      # the encrypted wallet, settings, coinjoin state and the Ark engine's data (ark/)
      - ${APP_DATA_DIR}/data:/data
    # The node is whichever app the user picked for the "bitcoin" dependency in
    # Umbrel (umbrelOS 1.3 or later). umbrelOS sources only that app's exports.sh,
    # and every Bitcoin node app that implements "bitcoin" copies its own
    # variables into APP_BITCOIN_*, so those always describe the selected node.
    # The app-specific names are passed too, as a fallback for a provider that
    # only exports its own names; they can only be set when that provider is
    # the one selected. The first set with an address and a port wins. This
    # replaces the image's entrypoint and then runs it unchanged.
    entrypoint:
      - /bin/sh
      - -c
      - |
        for p in KNOTS_BLAKE2B BITCOIN_KNOTS BITCOIN; do
          eval "ip=\$${NODE_$${p}_IP:-} port=\$${NODE_$${p}_PORT:-}"
          if [ -n "$$ip" ] && [ -n "$$port" ]; then
            eval "BITCOIN_RPC_USER=\$${NODE_$${p}_USER:-} BITCOIN_RPC_PASS=\$${NODE_$${p}_PASS:-}"
            BITCOIN_RPC_URL="http://$$ip:$$port/"
            export BITCOIN_RPC_URL BITCOIN_RPC_USER BITCOIN_RPC_PASS
            echo "Kilowallet: using the node at $$BITCOIN_RPC_URL (APP_$${p}_*)" >&2
            break
          fi
        done
        if [ -z "$${BITCOIN_RPC_URL:-}" ]; then
          echo "Kilowallet: no Bitcoin node app is selected or installed; choose one in this app's settings (a node on the BLAKE2b chain)" >&2
          BITCOIN_RPC_URL="http://127.0.0.1:1/"
          export BITCOIN_RPC_URL
        fi
        exec java -Xmx256m -jar /opt/kilowallet/kilowallet-server.jar
    environment:
      HOME: "/data"
      KILOWALLET_DATA: "/data"
      KILOWALLET_PORT: "8080"
      # Knots (BLAKE2b) Companion, PaulsCode.Com store
      NODE_KNOTS_BLAKE2B_IP: "${APP_KNOTS_BLAKE2B_NODE_IP:-}"
      NODE_KNOTS_BLAKE2B_PORT: "${APP_KNOTS_BLAKE2B_RPC_PORT:-}"
      NODE_KNOTS_BLAKE2B_USER: "${APP_KNOTS_BLAKE2B_RPC_USER:-}"
      NODE_KNOTS_BLAKE2B_PASS: "${APP_KNOTS_BLAKE2B_RPC_PASS:-}"
      # Bitcoin Knots, Misc store (btc-bitcoinknots) or Umbrel App Store (bitcoin-knots)
      NODE_BITCOIN_KNOTS_IP: "${APP_BITCOIN_KNOTS_NODE_IP:-}"
      NODE_BITCOIN_KNOTS_PORT: "${APP_BITCOIN_KNOTS_RPC_PORT:-}"
      NODE_BITCOIN_KNOTS_USER: "${APP_BITCOIN_KNOTS_RPC_USER:-}"
      NODE_BITCOIN_KNOTS_PASS: "${APP_BITCOIN_KNOTS_RPC_PASS:-}"
      # The selected "bitcoin" provider, whichever it is (Bitcoin Node itself included)
      NODE_BITCOIN_IP: "${APP_BITCOIN_NODE_IP:-}"
      NODE_BITCOIN_PORT: "${APP_BITCOIN_RPC_PORT:-}"
      NODE_BITCOIN_USER: "${APP_BITCOIN_RPC_USER:-}"
      NODE_BITCOIN_PASS: "${APP_BITCOIN_RPC_PASS:-}"
