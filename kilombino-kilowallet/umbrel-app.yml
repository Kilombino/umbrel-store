# umbrelOS 1.3 is the first version that lets the user pick which app answers a
# dependency (any installed app that declares `implements: [bitcoin]`), and from
# 1.3 the App Store asks for an umbrelOS update on an older system.
manifestVersion: 1.3.0
id: kilombino-kilowallet
category: bitcoin
name: Kilowallet
version: "0.6.0"
tagline: The Bitcoin BLAKE2b (XBT) wallet, on your own node
description: >-
  Kilowallet is the wallet of the Kilowallet Android app for the Bitcoin
  BLAKE2b chain (XBT), on your Umbrel: the same wallet code, with a web app
  made for the phone (add it to your home screen), reading the chain straight
  from your own BLAKE2b node, with no Electrum server in between.


  HOW IT WORKS


  Kilowallet first checks that the node follows the BLAKE2b chain, and does
  nothing on a node that does not. Then the node gets a watch-only wallet named
  kilowallet-… with the public key only, which tracks history, the mempool and
  balances; a pruned node works too. A hot wallet's words are encrypted with your password on this server
  (PBKDF2 and AES-256-GCM), never enter the node, and the password is asked
  again before every send. There is no way to recover the password: keep your
  words safe. A watch-only wallet (xpub, ypub, zpub) sends through a PSBT
  signed elsewhere. Every signature uses the unified sighash (0x21), so a
  spend cannot be replayed on the SHA-256 chain.


  Coin control, RBF, CPFP, a second confirmation for a fee that looks like a
  slip, contacts, street mode, and USD/EUR prices if you want them.


  COINJOIN AND ARK (BETA, OFF UNTIL YOU TURN THEM ON)


  Coinjoin mixes your coins in the same pools as the Kilowallet app and
  Kilojoin (relay.kilombino.com), with blind outputs (Kilojoin v3): nobody, not
  even a pool's creator, can tell whose mixed output is whose, with alerts in the browser and through your
  own Telegram bot. Ark gives you payments to Ark addresses and Lightning
  through the Paperclip Ark server (ark.paperclippool.xyz), with the same
  words as the wallet. Ark reads the chain from the node only if it has
  txindex on: the Bitcoin Knots app has it by default (unless you turn on
  pruning), Knots (BLAKE2b) Companion turns it off while it is pruned (its
  default). Without txindex, choose mempool.kilombino.com as the chain source
  when activating Ark. Both are for hot wallets only.


  WHICH NODE IT NEEDS


  Any Bitcoin node app on your Umbrel that follows the BLAKE2b chain.
  Kilowallet finds it by itself: if Umbrel offers another node when you
  install it (the Bitcoin Node app, on the SHA-256 chain, comes first when it
  is installed), Kilowallet switches to the BLAKE2b node when it starts.

  - Knots (BLAKE2b) Companion, from the PaulsCode.Com community store
  (https://github.com/paulscode/umbrel-store), with its wallet feature on
  (the default).

  - Bitcoin Knots from the Misc community store
  (https://github.com/Horizon-btc/Bitcoin-store), running Knots v29.4.1 or
  later, which its default choice (the latest version) already is.


  The Bitcoin Node app of the Umbrel App Store follows the SHA-256 chain, and
  so does the Bitcoin Knots app of the Umbrel App Store for now: if one of
  those is the only node, Kilowallet shows a page that says so and does
  nothing. Needs umbrelOS 1.3 or later.
developer: Kilombino
