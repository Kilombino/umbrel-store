releaseNotes: >-
  Kilowallet now checks on its own which chain the node follows, at start and
  every minute. The SHA-256 chain shares its history with BLAKE2b up to block
  961,639, so a node on it would show the same coins as if they were XBT. If
  the node follows the SHA-256 chain, has stopped just before the BLAKE2b fork,
  or is still syncing below it, the page says so and Kilowallet creates, scans
  and sends nothing until it is on the BLAKE2b chain.
