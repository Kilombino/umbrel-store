releaseNotes: >-
  Kilojoin v4, as in Kilowallet 1.2.0: whoever opens a coinjoin pool now picks
  how many mixed outputs each person gets, 1 to 5. With 4 outputs of 1 000 000
  sats, each person gets four outputs of 1 000 000 to four unused addresses of
  their own, and the perfect coin is 4 000 000 plus the fee. A pool of one
  output each is still v3, so every v3 wallet can join it.
