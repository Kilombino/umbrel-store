releaseNotes: >-
  As in Kilowallet 1.2.6. Cancel an unconfirmed send: in its details, CANCEL
  replaces it (RBF) with one that sends the same coins back to a fresh address
  of this wallet, paying a little more fee; cancelling the payment that makes a
  perfect coin drops that coin and its pool. The perfect coin's change goes to
  the pool's address type. Coinjoin to another wallet: SHOW THE ADDRESSES lists
  the unused addresses the mixed outputs would take, with their path, to
  compare with that wallet before joining, and a round's card shows its real
  addresses and which wallet (name and key start). A plain xpub asks for its
  address type, and a key that is not an account key is pointed out. Each open
  pool is notified once. The COINJOIN tab can be opened without notifications,
  and settings open in place of the page. Speeding up or cancelling no longer
  takes a minute.
submitter: Kilombino
submission: https://github.com/Kilombino/umbrel-store
