version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_BLAKE2B_POOL_BALANCE_IP
      APP_PORT: "7156"

  chooser:
    build:
      context: ${APP_DATA_DIR}
      dockerfile: Dockerfile
    hostname: chooser
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 20s
    command: ["python3", "/opt/routehash/pool_balance_loop.py", "--data", "/data", "--ui", "7156"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    networks:
      default:
        ipv4_address: $APP_BLAKE2B_POOL_BALANCE_IP
