category: bitcoin
name: Kilowallet (Bitcoin Knots)
version: "0.4.3"
tagline: The Bitcoin BLAKE2b (XBT) wallet, on the Bitcoin Knots app
description: >-
  Kilowallet is the wallet of the Kilowallet Android app for the Bitcoin
  BLAKE2b chain (XBT), on your Umbrel: the same wallet code, with a web app
  made for the phone (add it to your home screen), reading the chain straight
  from the Bitcoin Knots app, with no Electrum server in between.


  HOW IT WORKS


  Kilowallet first checks that the node follows the BLAKE2b chain, and does
  nothing on a node that does not. Then the node gets a watch-only wallet named
  kilowallet-… with the public key only, which tracks history, the mempool and
  balances; a pruned node works too. A hot wallet's words are encrypted with your password on this server
  (PBKDF2 and AES-256-GCM), never enter the node, and the password is asked
  again before every send. There is no way to recover the password: keep your
  words safe. A watch-only wallet (xpub, ypub, zpub) sends through a PSBT
  signed elsewhere. Every signature uses the unified sighash (0x21), so a
  spend cannot be replayed on the SHA-256 chain.


  Coin control, RBF, CPFP, a second confirmation for a fee that looks like a
  slip, contacts, street mode, and USD/EUR prices if you want them.


  COINJOIN AND ARK (BETA, OFF UNTIL YOU TURN THEM ON)


  Coinjoin mixes your coins in the same pools as the Kilowallet app and
  Kilojoin (relay.kilombino.com), with alerts in the browser and through your
  own Telegram bot. Ark gives you payments to Ark addresses and Lightning
  through the Paperclip Ark server (ark.paperclippool.xyz), with the same
  words as the wallet. Ark reads the chain from the node only if it has
  txindex on, which the Bitcoin Knots app has by default (unless you turn on
  pruning); otherwise choose mempool.kilombino.com as the chain source when
  activating Ark. Both are for hot wallets only.


  WHICH NODE IT NEEDS


  The Bitcoin Knots app from the Umbrel App Store, running a Knots version
  that follows the BLAKE2b chain. From that app's version 1.2.18 on, its
  default choice (always the latest Knots version) does; if you pinned an older
  version in its settings, set it back to the latest. Nothing to set up here:
  Kilowallet uses that app's RPC with the credentials it generates, and its
  default settings (wallet feature on, RPC open to the apps, txindex) are what
  Kilowallet needs. A pruned node works too.


  Version 1.2.13 of the Bitcoin Knots app, the one in the Umbrel App Store as
  this is written, has no Knots version with BLAKE2b: its update with BLAKE2b
  (1.2.18) is still waiting to be accepted there. On a Knots version without
  BLAKE2b the node follows the SHA-256 chain, or stops on block 961,639 just
  before the BLAKE2b fork. Either way Kilowallet shows a page that says so,
  and creates, scans and sends nothing until the node is on the BLAKE2b chain.


  If your node is Knots (BLAKE2b) Companion, from the PaulsCode.Com community
  store, install "Kilowallet" from this same store instead: that one is made
  for Paul's Companion.
