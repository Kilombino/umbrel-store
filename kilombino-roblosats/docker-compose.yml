version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kilombino-roblosats_web_1
      APP_PORT: 12596

  web:
    image: ghcr.io/kilombino/roblosats-client:v0.9.12@sha256:ffa0b5bfbfd936e8eb86322dbdf996192befad818f5b23c4271376544a110610
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      # Every coordinator of the federation is reached over Umbrel's Tor.
      TOR_PROXY_IP: ${TOR_PROXY_IP}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT}
      # umbrelOS protects browser connections with HTTPS and authentication: plain HTTP inside.
      PLAIN_HTTP: "1"
