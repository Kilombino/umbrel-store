version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kilombino-roblosats_web_1
      APP_PORT: 12596

  web:
    image: ghcr.io/kilombino/roblosats-client:v0.8.7-rl16@sha256:411f4d52c237a87c73cc900bc1d4456af8aa2beec1e8147a69f5b76323cba594
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      # Every coordinator of the federation is reached over Umbrel's Tor.
      TOR_PROXY_IP: ${TOR_PROXY_IP}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT}
      # umbrelOS protects browser connections with HTTPS and authentication: plain HTTP inside.
      PLAIN_HTTP: "1"
