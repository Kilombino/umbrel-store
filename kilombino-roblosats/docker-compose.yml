version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kilombino-roblosats_web_1
      APP_PORT: 12596

  web:
    image: ghcr.io/kilombino/roblosats-client:v0.8.8-rl23@sha256:357a07b41b76cacfd1a5958141fa174ac57fa6a111c2075e716e5c7901776693
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      # Every coordinator of the federation is reached over Umbrel's Tor.
      TOR_PROXY_IP: ${TOR_PROXY_IP}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT}
      # umbrelOS protects browser connections with HTTPS and authentication: plain HTTP inside.
      PLAIN_HTTP: "1"
