id: kilombino-roblosats
category: bitcoin
name: Roblosats
version: "0.8.7-rl16"
tagline: Simple and private P2P exchange for Bitcoin (BLAKE2b)
description: >-
  Roblosats is RoboSats for the Bitcoin BLAKE2b chain (BTC): a simple and
  private way to exchange bitcoin for national currencies (and for Spamcoin),
  peer to peer, over the Lightning network, with hold invoices so neither side
  can run away with the funds.


  This app is the Roblosats client served from your own Umbrel. It talks to
  every coordinator of the Roblosats federation over Umbrel's Tor, so they
  only ever see a Tor connection. No account, no KYC: your robot is generated
  from a token that only you keep.


  - Fidelity bonds and escrow with Lightning hold invoices.

  - PGP-encrypted chat with your peer.

  - The buyer can take the sats on-chain.

  - Over 60 fiat currencies, priced from the BLAKE2b chain's own markets.


  Coordinators today: Kilobot, marcanoTrades and Rose Garden. Keep your robots' tokens: on
  another device or browser, recover a robot with its token.


  You need a Lightning wallet on the BLAKE2b chain to trade (Kilowallet,
  Lightning Fork with ThunderHub XBT, or any wallet that pays BLAKE2b
  Lightning invoices).
releaseNotes: >-
  Roblosats 0.8.7-rl16. Same client as 0.8.7-rl15-1, built from rl16 so the
  version matches the Android app (whose built-in Tor moved to 0.4.9).
  Federation: Kilobot, marcanoTrades and Rose Garden.
