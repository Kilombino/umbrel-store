id: kilombino-roblosats
category: bitcoin
name: Roblosats
version: "0.8.8-rl30"
tagline: Simple and private P2P exchange for Bitcoin (BLAKE2b)
description: >-
  Roblosats is RoboSats for the Bitcoin BLAKE2b chain (BTC): a simple and
  private way to exchange bitcoin for national currencies (and for Spamcoin),
  peer to peer, over the Lightning network, with hold invoices so neither side
  can run away with the funds.


  This app is the Roblosats client served from your own Umbrel. It talks to
  every coordinator of the Roblosats federation over Umbrel's Tor, so they
  only ever see a Tor connection. No account, no KYC: your robot is generated
  from a token that only you keep.


  - Fidelity bonds and escrow with Lightning hold invoices.

  - PGP-encrypted chat with your peer.

  - The buyer can take the sats on-chain.

  - Over 60 fiat currencies, priced from the BLAKE2b chain's own markets.


  Coordinators today: Kilobot, marcanoTrades and Rose Garden. Keep your robots' tokens: on
  another device or browser, recover a robot with its token.


  You need a Lightning wallet on the BLAKE2b chain to trade (Kilowallet,
  Lightning Fork with ThunderHub XBT, or any wallet that pays BLAKE2b
  Lightning invoices).
releaseNotes: >-
  Roblosats 0.8.8-rl30: when the lightning payment to you as buyer fails, the
  "payment failed" screen has an Onchain tab to get paid onchain instead (on
  coordinators that offer onchain payouts).


  Roblosats 0.8.8-rl25: with the chat in Nostr mode, every message reaches the
  coordinator again (before, only the first one did, so a peer on the API
  connection missed messages and disputes had no chat).


  Roblosats 0.8.8-rl24: in orders paid in Spamcoin, both sides now see the
  same Spamcoin amount, fixed by the coordinator when the order is taken
  (shown with "="; with "≈" while it is still an estimate or with a
  coordinator that is not updated yet).


  Roblosats 0.8.8-rl23: new coordinators now start with a 25M sats order
  limit instead of 250k sats, so young coordinators such as Rose Garden can
  take normal-sized orders.


  Roblosats 0.8.8-rl20: the trade screen now redraws after an action, e.g.
  after Confirm fiat sent it no longer keeps showing the button.


  Roblosats 0.8.8-rl18, based on RoboSats v0.8.8: garage key (one key for all
  your robots), coordinator fees in the order view, a better coordinator
  selector and two months of upstream fixes. Federation: Kilobot,
  marcanoTrades and Rose Garden.
