releaseNotes: >-
  1.4.5: you can save several public stratums for PyBLOCK and P2Hash, each with
  an optional name, and choose in a dropdown which one new orders and rentals
  use: for instance two ports of the same host running different gateways, one
  at a time, never mixed. Running orders keep mining where they started. Your
  current stratum becomes the first one of the list, and "Probar gateway" checks
  the one in use.


  1.4.4: the market has a blacklist. A rig goes on it by itself when a rental of
  it ends with the sad face (less than 95 % of what was paid reached your
  gateway) or when a ticket is opened for it (by hand, from the ticket dialog,
  or by the automatic notice at the end). The market keeps showing it in red
  with a tag that says why and asks again before renting it; a switch hides
  them. The thumbs-down next to the star puts a rig on the list or takes it off
  by hand, and the finished rentals section lists them so you can remove them.
  The first start fills the list from the rentals already in your history.


  1.4.3: the finished-rentals table shows how much MRR refunded (in the coin and
  as a % of what was paid, read from your MRR transactions) and whether a ticket
  was opened: stamped by the panel's ticket button, ticked by hand for tickets
  opened on MRR's site, or by the automatic ticket. The page is shorter: finished
  rentals, ASICs, the market (MRR and PyBLØCK, with its packages and P2Hash
  folding separately) and the logs are collapsible, closed by default, and each
  browser remembers what is open. The total gateway hashrate is always in the
  header.


  1.4.2: rent on P2Hash (PyBLØCK's hashrate market on Nostr) from the panel,
  each tranche paid in advance from a separate pay-only wallet connection (NWC)
  and only while your DATUM sees the hash. By default every tranche waits for
  your click; automatic payment needs its switch and both caps (off by default).
  P2Hash rentals show next to MRR's with face, verdict and per-tranche figures,
  a Stop button and history. PyBLØCK market rentals made on their web can be
  added (secret link, or the miner id as an estimate). Detected rentals without
  a worker are now measured by address.


  1.4.1: the automatic ticket follows MRR's policy: it looks at a rental only
  after it ends, inside MRR's 12-hour window and after MRR's own review (8.5 h),
  flags it when the final delivery is below 100 % beyond statistical noise (3
  sigmas), skips rentals MRR already refunded and sends you the ticket text with
  the time left; posting the evidence to the owner is a separate option. The
  mid-rental part is now an optional early message to the owner. Your own
  miners (a rig listed on PyBLØCK market that comes back to your gateway) are no
  longer shown as rentals: mark them with "es mío".


  1.4.0: rentals that underdeliver get an "Abrir ticket" button with the evidence
  (paid, what MRR says, what reached your DATUM CONVOY) ready to paste and the
  rental opened on MRR, which has no API for tickets; finished rentals keep it
  while MRR's 12-hour claim window is open. An optional automatic notice, off by
  default, keeps the evidence, alerts you and can post it on the rental's
  message thread for the owner, once per rental. Each history entry can be
  deleted by hand; PyBLØCK orders stay in the history too; hashrate from
  PyBLØCK market and other rental markets (p2phash, TideHash, RouteHash) is shown
  as detected. Fixes: rentals no longer taken for finished while still running,
  rig names no longer escaped twice, renewal prices kept through MRR's rate
  limit.


  1.3.0: add PyBLØCK orders made outside the panel (PyBLØCK's web or app, any
  payment method) by pasting the order id or its tracking link, and follow
  them like the others (measured on their worker if you give it, otherwise by
  payout address as an estimate); unpaid PyBLØCK invoices are shown as such
  instead of as an expired rental; extending an MRR rental no longer fails
  with "too soon" (the cost is estimated from the rig's current price) and
  MRR's refusal message is shown.


  1.2.0: PyBLØCK rentals next to MRR (packages, manual orders with an invoice
  you pay from your own wallet, status, and what each rental really delivers
  to your gateway next to what PyBLØCK says); the price per TH/day you paid
  and the renewal price on every rental; faces, stars and verdicts for
  PyBLØCK rentals too. Set your DATUM CONVOY stratum as the internet sees it
  (host:port) in the PyBLØCK row of the MRR API key card.


  1.1.0: your MRR balance as a pill in the header, always visible; minutes
  when less than an hour of a rental is left; a star under each rental's face
  to keep its rig as a favourite; market columns RPI, Perf 24 h and Perf 30
  min coloured like the sparkline, with the best buy always in the table.


  1.0.0:   First release: the MRR API key is linked, checked and unlinked from the
  dashboard, and the DATUM gateway is DATUM CONVOY's, read from its own
  settings.
