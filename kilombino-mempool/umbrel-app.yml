# umbrelOS 1.3: the user picks which app answers the `bitcoin` dependency.
manifestVersion: 1.3.0
id: kilombino-mempool
category: bitcoin
name: Mempool Kilombino
version: "3.2.1.3"
tagline: Mempool explorer for the Bitcoin BLAKE2b chain, by Kilombino
description: >-
  The explorer that runs at mempool.kilombino.com, on your own Umbrel: blocks,
  transactions, addresses, fees and the mempool of the Bitcoin BLAKE2b chain
  (BTC), read from your own node. It adds what that chain needs: 164-byte
  headers and 800,000 weight units per block, a mining dashboard that
  recognizes its pools, BTC prices, and a world map of the nodes your node
  finds on the network.


  WHAT IT NEEDS


  A Bitcoin node on the BLAKE2b chain and an Electrum server, both found in
  this store: Bitcoin Knots and Electrs Pruned (Kilombino). Install them first
  and pick them when Umbrel asks. Knots (BLAKE2b) Companion and Paul's Electrs
  Pruned from the PaulsCode.Com community store
  (https://github.com/paulscode/umbrel-store) work as well. On a node of the
  SHA256 chain this explorer stops and says so in its log.


  The node must keep the whole chain with the transaction index on (Knots
  (BLAKE2b) Companion is pruned by default: in its settings, turn pruning off
  and txindex on; turning pruning off downloads the full chain). This explorer
  looks transactions up in the node itself; on a pruned node use Mempool
  Pruned instead.


  NODES MAP


  Every hour the explorer contacts the nodes your node knows on this chain and
  places them on a world map, shown on the dashboard and at /nodes-map/. The
  locations come from DB-IP's free IP-to-city database, downloaded once a
  month; no address is sent to any outside service. Onion nodes appear only
  while they are connected to your node.


  LIGHTNING


  With Lightning XBT (this store) or Lightning Fork installed and its wallet
  created, the Lightning tab shows the Lightning network of this chain. Restart
  this app after installing it.


  Installs alongside the official Mempool and Mempool Pruned.
developer: Kilombino
website: https://mempool.kilombino.com
# paulscode-electrs-pruned: Paul's Electrs Pruned, or Electrs Pruned (Kilombino)
# from this store, which declares `implements: [paulscode-electrs-pruned]`.
dependencies:
  - bitcoin
  - paulscode-electrs-pruned
repo: https://github.com/Kilombino/mempool-bip110
support: https://t.me/Kilombino
# Clear of the PaulsCode.Com store's tiles (7150-7156), ThunderHub XBT (7160) and Kilowallet (7161).
port: 7162
icon: https://raw.githubusercontent.com/Kilombino/umbrel-store/master/kilombino-mempool/icon.png
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  3.2.1.3: up to date with mempool.kilombino.com (images v3.2.1-k2): the
  mining pools list with the latest BLAKE2b miners, the YSH (Your Security
  Hashrate) texts and the header names. Everything it needs is now in this
  store: Electrs Pruned (Kilombino) can stand in for Paul's Electrs Pruned
  (install it first and pick it when asked), and the Lightning tab also works
  with Lightning XBT. Nothing changes if you already use Paul's apps.


  3.2.1.2: the app offers itself to Lightning Fork's dashboard as a source
  of fee rates and transaction links (needs a Lightning Fork version that
  reads the list of Mempool apps). Nothing else changes.


  3.2.1.1, first release: the explorer of mempool.kilombino.com with the Bitcoin Nodes
  World Map, on your own Knots (BLAKE2b) node and Electrs Pruned.
submitter: Kilombino
submission: https://github.com/Kilombino/umbrel-store
